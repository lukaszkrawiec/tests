[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenreport"
version = "0.1.0"
description = "CI token accounting for agent applications: measure the context your repo commits to sending"
requires-python = ">=3.11"
# tiktoken is the default counter, so it is a real dependency. The Anthropic counter
# needs nothing extra: it speaks HTTP directly, which keeps it pointable at a local fake
# in tests and avoids a second SDK in the install.
dependencies = ["tiktoken>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
tokenreport = "tokenreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["error"]
